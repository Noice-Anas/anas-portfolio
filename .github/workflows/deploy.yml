name: Build, release & deploy to GitHub Pages

# Builds the static Arabic page (index-ar.html) with `npm run build`, then
# deploys the whole site to GitHub Pages. Because index-ar.html is generated in
# CI (it is git-ignored), the live site is always in sync with index.html +
# assets/js/i18n-data.js — no one has to remember to rebuild before pushing.
#
# Deployment branch: live-deploy. ONE-TIME SETUP (required): in the repo on GitHub, go to
#   Settings → Pages → "Build and deployment" → Source → "GitHub Actions".
# The custom domain (noiceanas.com, via the CNAME file) carries over unchanged.

on:
  push:
    branches: [live-deploy]
  workflow_dispatch:
    inputs:
      bump:
        description: Release bump for a manually started deployment
        required: true
        default: patch
        type: choice
        options: [patch, minor, major]

# Least-privilege token the deploy-pages action needs.
permissions:
  contents: write
  pages: write
  id-token: write

# Never run two deploys at once; let an in-progress one finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build bilingual static site
        run: npm run build

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  release:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository and tags
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Calculate next version
        id: version
        env:
          BUMP: ${{ inputs.bump || 'patch' }}
        shell: bash
        run: |
          set -euo pipefail
          latest="$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-version:refname | head -n 1)"

          if [[ -z "$latest" ]]; then
            version="$(node -p "require('./package.json').version")"
            [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Invalid package.json version: $version"; exit 1; }
          else
            version="${latest#v}"
            IFS=. read -r major minor patch <<< "$version"
            case "$BUMP" in
              major) major=$((major + 1)); minor=0; patch=0 ;;
              minor) minor=$((minor + 1)); patch=0 ;;
              patch) patch=$((patch + 1)) ;;
              *) echo "Unsupported bump: $BUMP"; exit 1 ;;
            esac
            version="$major.$minor.$patch"
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - name: Create Git tag
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Release $TAG" "$GITHUB_SHA"
          git push origin "$TAG"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --generate-notes --title "$TAG" --notes "Live deployment from live-deploy at $GITHUB_SHA."
