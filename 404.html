       keeps the original path, so every asset path MUST be root-absolute (/...),
       never relative (./...). This page is intentionally self-contained (inline
       CSS) and does NOT redirect: it returns real 404 content with links,
       avoiding a soft-404. -->

       site (localStorage 'portfolio-theme' === 'dark'). OS preference ignored. -->

    try {
      if (window.localStorage.getItem('portfolio-theme') === 'dark') {
        document.documentElement.setAttribute('data-theme', 'dark');
      }
    } catch (storageError) { /* storage blocked: stay light */ }
  </script>
  <!-- Umami analytics (same property as the main site): surfaces which URLs
       are hitting the 404 so broken or renamed paths show up in the dashboard. -->

  <main class="wrap">
    <p class="note">Error 404</p>
    <div class="code" aria-hidden="true">404</div>
    <h1>This page is not here</h1>
    <p>The address may be mistyped, or the page has moved. The home page links to everything on the site.</p>
    <div class="ar" lang="ar" dir="rtl">
      <h2>الصفحة غير موجودة</h2>
      <p>ربما كُتب الرابط بشكل خاطئ، أو نُقلت الصفحة. تجد كل محتوى الموقع في الصفحة الرئيسية.</p>
    </div>
    <div class="actions">
      <a class="btn primary" href="/" data-track-event="404-home">Back to home</a>
      <a class="btn" href="/index-ar" lang="ar" data-track-event="404-arabic">الصفحة العربية</a>
    </div>
  </main>
  <script>
    /* Same-tab links report through data-track-event on pointerdown, never
       data-umami-event: Umami's capture-phase click handler would hold the
       navigation for its network round trip. See CLAUDE.md "Analytics". */
    (function () {
      function report(target) {
        var link = target && target.closest ? target.closest('[data-track-event]') : null;
        if (!link || !window.umami || typeof window.umami.track !== 'function') return;
        try { window.umami.track(link.getAttribute('data-track-event'), { path: location.pathname }); } catch (trackError) {}
      }
      document.addEventListener('pointerdown', function (event) { report(event.target); }, true);
      document.addEventListener('keydown', function (event) {
        if (event.key === 'Enter' || event.key === ' ') report(event.target);
      }, true);
    })();
  </script>
</body>
